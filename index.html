<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひらがな きいて えらぼう</title>

  <style>
    body {
      font-family:
        "UD デジタル 教科書体",
        "BIZ UD教科書体",
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      font-size: 28px;
      margin-top: 20px;
    }

    #message {
      font-size: 22px;
      height: 30px;
      margin: 10px;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
    }

    .card span {
      font-size: 42px;
    }

    .card img {
      width: 120px;
      height: auto;
    }

    .card:active {
      transform: scale(0.95);
    }

    .correct-highlight {
      background: #fff3a0;
      box-shadow: 0 0 20px 8px #ffd700;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    #score {
      font-size: 20px;
      margin: 10px;
    }
  </style>
</head>

<body>
  <h1>🎧 きいて えらぼう</h1>

  <div id="message"></div>

  <button onclick="playSound()">🔊 もう一回きく</button>

  <div id="cards"></div>

  <div id="score">スコア：0</div>

  <script>
    // SVGを使う文字（書写用）
    const svgChars = ["さ", "り", "き"];

    // ひらがなと音声（ローマ字）の対応
    const hiraganaList = [
      { char: "く", sound: "ku" },
      { char: "へ", sound: "he" },
      { char: "し", sound: "shi" },
      { char: "つ", sound: "tsu" }
    ];

    let correct = {};
    let score = 0;
    let audio = new Audio();

    function playRound() {
      document.getElementById("message").textContent = "";

      correct = hiraganaList[Math.floor(Math.random() * hiraganaList.length)];

      audio = new Audio("sounds/" + correct.sound + ".m4a");
      setTimeout(() => {
        audio.play().catch(() => {});
      }, 300);

      const shuffled = [...hiraganaList]
        .sort(() => Math.random() - 0.5)
        .slice(0, 4);

      if (!shuffled.some(item => item.char === correct.char)) {
        shuffled[Math.floor(Math.random() * shuffled.length)] = correct;
      }

      const cardsDiv = document.getElementById("cards");
      cardsDiv.innerHTML = "";

      shuffled.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";

        // SVGか文字かを判定
        if (svgChars.includes(item.char)) {
          const img = document.createElement("img");
          img.src = "images/" + item.sound + ".svg";
          img.alt = item.char;
          div.appendChild(img);
        } else {
          const span = document.createElement("span");
          span.textContent = item.char;
          div.appendChild(span);
        }

        div.onclick = () => checkAnswer(item);
        cardsDiv.appendChild(div);
      });
    }

    function playSound() {
      audio.currentTime = 0;
      audio.play();
    }

    function checkAnswer(selected) {
      if (selected.char === correct.char) {
        score += 10;
        document.getElementById("score").textContent = "スコア：" + score;
        document.getElementById("message").textContent = "🎉 せいかい！";
        setTimeout(playRound, 800);
      } else {
        document.getElementById("message").textContent = "🙂 ここだよ";

        const cards = document.querySelectorAll(".card");
        cards.forEach(card => {
          if (
            (card.textContent && card.textContent === correct.char) ||
            (card.querySelector("img") &&
             card.querySelector("img").alt === correct.char)
          ) {
            card.classList.add("correct-highlight");
            audio.currentTime = 0;
            audio.play();

            setTimeout(() => {
              card.classList.remove("correct-highlight");
            }, 1000);
          }
        });
      }
    }

    playRound();
  </script>
</body>
</html>
